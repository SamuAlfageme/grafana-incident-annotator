# Builds and publishes a draft GitHub release when a version tag is pushed.
# See https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Plugin
        uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        env:
          SKIP_OSV_SCANNER: 'true'
        with:
          node-version: '24.16.0'
          attestation: true
          use_changelog_generator: true
          token: ${{ secrets.GITHUB_TOKEN }}
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
